<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GratefulDev — Angular</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
    <script>
      // Restore path from GitHub Pages 404 redirect
      ;(function () {
        var p = new URLSearchParams(window.location.search).get('p')
        if (p) window.history.replaceState(null, null, p + window.location.hash)
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
